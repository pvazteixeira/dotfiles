# Third-party repos pulled in by chezmoi instead of ansible git tasks.
# `chezmoi apply` clones/refreshes these; refreshPeriod throttles network hits.
# NOTE: the oh-my-zsh custom plugins/themes are nested inside the .oh-my-zsh
# external — verify they apply cleanly on first run (known chezmoi sharp edge).

[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k.git"
    refreshPeriod = "168h"
