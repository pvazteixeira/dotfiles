# kitty configuration.
#
# Division of labour: zellij owns multiplexing (tabs, splits, sessions — see
# dot_config/zellij/config.kdl), so kitty stays a thin terminal layer and
# defines no tab/window keybinds of its own. The login shell is zsh (set by
# the ansible playbook), so there's no `shell`/auto-launch directive here —
# start zellij yourself when you want it.

# ===== font =====
# MesloLGS NF is installed by the playbook; it carries the Nerd Font glyphs
# powerlevel10k needs (without it the prompt renders as tofu boxes).
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ===== bell =====
enable_audio_bell no

# ===== scrollback =====
scrollback_lines 10000

# ===== cursor =====
cursor_shape           beam
cursor_blink_interval  0

# ===== display server =====
# auto prefers Wayland and falls back to X11 only when there's no Wayland
# session — Wayland-first without hard-coding it (replaces the old forced x11).
linux_display_server auto

# ===== misc =====
# Don't nag about closing a window with running processes — zellij/zsh manage
# their own lifecycles.
confirm_os_window_close 0
