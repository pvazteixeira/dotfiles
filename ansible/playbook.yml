---
- name: Basic setup for local machine
  hosts: localhost

  vars:
    # System / root / bootstrap packages stay on apt. User CLIs (ripgrep, fd,
    # fzf, duf, ncdu, htop, tig, ranger, zoxide) are installed via pixi below.
    packages_to_install:
      - apt-file
      - apt-transport-https  #
      - ca-certificates      #
      - chrony               # ntp+ptp
      - curl                 #
      - flatpak              # for obsidian (extras)
      - fonts-powerline      #
      - git                  #
      - mtr                  # 
      - mosh                 #
      - powertop             #
      - rsync                #
      - trash-cli            #
      - wget
      - zsh

    # User CLIs installed via `pixi global` (idempotent; just add to the list).
    pixi_globals:
      - btop
      - duf
      - fd-find
      - fzf
      - ncdu
      - ranger-fm
      - ripgrep
      - tig
      - yazi
      - zellij
      - zoxide

  handlers:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

  tasks:
    - name: Install packages
      become: yes
      ansible.builtin.package:
        name: "{{ packages_to_install }}"
        state: present

    - name: Change default shell to zsh
      become: yes
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        shell: /bin/zsh

    # Dotfiles and third-party repos (oh-my-zsh, powerlevel10k,
    # zsh-autosuggestions) are managed by chezmoi: the dot_* files under
    # home/ plus home/.chezmoiexternal.toml. This playbook only installs the
    # chezmoi binary; applying the dotfiles is the final interactive step
    # (see below / README), because `chezmoi init --apply` prompts for git
    # identity and must not be run non-interactively (it would silently apply
    # the personal defaults on a work host).
    - name: Install chezmoi to ~/.local/bin
      become: no
      ansible.builtin.shell: |
        sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "{{ ansible_facts.env.HOME }}/.local/bin"
      args:
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/chezmoi"

    - name: How to apply dotfiles
      become: no
      ansible.builtin.debug:
        msg: >-
          chezmoi installed. Apply your dotfiles with:
          chezmoi init --apply --source {{ ansible_facts.env.HOME }}/dotfiles/home
          (you'll be prompted for git name/email/github user; defaults are the
          personal values — override them on a work host).

    - name: Install pixi to ~/.pixi/bin
      become: no
      ansible.builtin.shell: |
        curl -fsSL https://pixi.sh/install.sh | bash
      args:
        creates: "{{ ansible_facts.env.HOME }}/.pixi/bin/pixi"
      environment:
        # PATH is managed in dot_zshenv, so don't let the installer edit rc files
        PIXI_NO_PATH_UPDATE: "1"

    - name: Install user CLIs with pixi
      become: no
      ansible.builtin.command:
        cmd: "{{ ansible_facts.env.HOME }}/.pixi/bin/pixi global install {{ pixi_globals | join(' ') }}"

    - name: Install rustup (rust toolchain + cargo)
      become: no
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path
      args:
        # dot_zshenv sources ~/.cargo/env, so --no-modify-path keeps rustup out of rc files
        creates: "{{ ansible_facts.env.HOME }}/.cargo/bin/cargo"

    # kitty: distro packages are stale (apt 0.32), so install the upstream
    # binary (same curl|sh + creates idempotency pattern as chezmoi/pixi/rustup
    # above). GUI app -> gated behind the kitty/extras tags so default
    # (headless) bootstraps skip it. Used with oh-my-zsh+p10k+zellij; the
    # MesloLGS NF task below gives p10k its prompt glyphs.
    - name: Install kitty via the upstream binary installer
      become: no
      ansible.builtin.shell: |
        curl -fsSL https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin launch=n
      args:
        # launch=n keeps the installer from opening a kitty window mid-provision
        creates: "{{ ansible_facts.env.HOME }}/.local/kitty.app/bin/kitty"
      tags: [extras, kitty]

    - name: Symlink kitty + kitten into ~/.local/bin
      become: no
      ansible.builtin.file:
        # ~/.local/bin is already on PATH (see dot_zshenv)
        src: "{{ ansible_facts.env.HOME }}/.local/kitty.app/bin/{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - kitty
        - kitten
      tags: [extras, kitty]

    - name: Install kitty desktop launcher
      become: no
      ansible.builtin.shell: |
        cp ~/.local/kitty.app/share/applications/kitty*.desktop ~/.local/share/applications/
        sed -i "s|Icon=kitty|Icon=$(readlink -f ~)/.local/kitty.app/share/icons/hicolor/256x256/apps/kitty.png|g" ~/.local/share/applications/kitty*.desktop
        sed -i "s|Exec=kitty|Exec=$(readlink -f ~)/.local/kitty.app/bin/kitty|g" ~/.local/share/applications/kitty*.desktop
      args:
        creates: "{{ ansible_facts.env.HOME }}/.local/share/applications/kitty.desktop"
      tags: [extras, kitty]

    # MesloLGS NF is the Nerd Font p10k's own `configure` wizard recommends;
    # kitty bundles none, so without this the prompt renders as tofu boxes.
    - name: Install MesloLGS NF font (for powerlevel10k glyphs in kitty)
      become: no
      ansible.builtin.get_url:
        url: "https://github.com/romkatv/powerlevel10k-media/raw/master/{{ item | urlencode }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts/{{ item }}"
        mode: "0644"
      loop:
        - MesloLGS NF Regular.ttf
        - MesloLGS NF Bold.ttf
        - MesloLGS NF Italic.ttf
        - MesloLGS NF Bold Italic.ttf
      register: meslo_fonts
      tags: [extras, kitty, fonts]

    # B612 Mono (the monospace cut of Airbus's B612 cockpit font). apt's
    # fonts-b612 ships only the proportional family, so vendor the Mono TTFs
    # from upstream — same pattern as MesloLGS NF above.
    - name: Install B612 Mono font
      become: no
      ansible.builtin.get_url:
        url: "https://github.com/polarsys/b612/raw/master/fonts/ttf/{{ item }}"
        dest: "{{ ansible_facts.env.HOME }}/.local/share/fonts/{{ item }}"
        mode: "0644"
      loop:
        - B612Mono-Regular.ttf
        - B612Mono-Bold.ttf
        - B612Mono-Italic.ttf
        - B612Mono-BoldItalic.ttf
      register: b612_fonts
      tags: [extras, fonts, b612]

    - name: Refresh font cache
      become: no
      ansible.builtin.command:
        cmd: fc-cache -f "{{ ansible_facts.env.HOME }}/.local/share/fonts"
      when: >-
        (meslo_fonts is defined and meslo_fonts is changed)
        or (b612_fonts is defined and b612_fonts is changed)
      tags: [extras, kitty, fonts, b612]

    # Standard (rootful) Docker install via the community role. Rootless setup
    # is done manually afterwards (dockerd-rootless-setuptool.sh install).
    # Requires: ansible-galaxy install -r ansible/requirements.yml
    - name: Install Docker engine via geerlingguy.docker
      become: yes
      tags: [extras, docker]
      block:
        - name: Include geerlingguy.docker role
          ansible.builtin.include_role:
            name: geerlingguy.docker

    - name: Add Flathub remote
      become: yes
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        state: present
      tags: [extras, obsidian]

    - name: Install obsidian
      community.general.flatpak:
        name: md.obsidian.Obsidian
        remote: flathub
        state: present
      tags: [extras, obsidian]

    - name: Install Syncthing
      ansible.builtin.include_tasks: syncthing.yml
      tags: [extras, syncthing]
